<!DOCTYPE html>
<html lang='ar' dir='rtl'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>مزيل الخلفية الخضراء - كيان استوديو</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link href='https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap' rel='stylesheet'>
    <style>body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f3f4f6; }</style>
</head>
<body class='min-h-screen flex flex-col justify-between'>
    <header class='border-b border-red-900/40 bg-[#0b0f19] px-4 h-16 flex items-center justify-between'>
        <span class='text-lg font-bold text-amber-400'>KAYAN STUDIO | عزل الشاشة الخضراء</span>
        <a href='/' class='text-xs text-gray-300 bg-gray-800 px-3 py-1.5 rounded-lg'>الرئيسية ←</a>
    </header>
    <div class='max-w-xl mx-auto px-4 py-8 w-full'>
        <div class='bg-[#111827] border border-red-900/50 rounded-2xl p-6 shadow-xl text-center'>
            <h1 class='text-xl font-bold text-amber-400 mb-2'>مصفاة عزل الخلفية الخضراء (Chroma Key)</h1>
            <p class='text-gray-400 text-xs mb-6'>ارفع الإطار أو الفيديو الأخضر ليتم تفريغ الخلفية فوراً</p>
            <input type='file' id='mediaFile' accept='image/*,video/*' class='w-full bg-[#0e1626] border border-red-900/50 rounded-xl p-3 text-xs text-gray-300 mb-4'>
            <button onclick='processChromaKey()' class='w-full py-3 rounded-xl font-bold bg-gradient-to-r from-red-800 to-amber-600 text-white shadow-lg mb-4'>تفريغ الخلفية الخضراء ⚡</button>
            
            <div id='resultArea' class='hidden mt-4 p-4 bg-black rounded-xl border border-amber-500/40'>
                <p class='text-amber-400 font-bold text-xs mb-2'>✨ النتيجة بعد التفريغ (شفاة/Transparent):</p>
                <div id='previewBox' class='w-64 h-64 mx-auto bg-[linear-gradient(45deg,#222_25%,transparent_25%),linear-gradient(-45deg,#222_25%,transparent_25%),linear-gradient(45deg,transparent_75%,#222_75%),linear-gradient(-45deg,transparent_75%,#222_75%)] bg-[size:20px_20px] bg-[position:0_0,0_10px,10px_-10px,-10px_0px] rounded-xl border-2 border-amber-500 flex items-center justify-center relative overflow-hidden'>
                </div>
                <a id='downloadLink' href='#' download='transparent_asset.png' class='block mt-4 py-2.5 rounded-xl font-bold bg-emerald-600 text-white text-xs shadow-lg'>📥 تحميل الملف المفرغ</a>
            </div>
        </div>
    </div>
    <script>
        function processChromaKey() {
            const input = document.getElementById('mediaFile');
            const file = input.files[0];
            const url = URL.createObjectURL(file);
            const box = document.getElementById('previewBox');
            box.innerHTML = '';

            if(file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'max-w-full max-h-full object-contain';
                box.appendChild(img);
            } else {
                const vid = document.createElement('video');
                vid.src = url;
                vid.controls = true;
                vid.autoplay = true;
                vid.loop = true;
                vid.className = 'max-w-full max-h-full object-contain';
                box.appendChild(vid);
            }
            document.getElementById('downloadLink').href = url;
            document.getElementById('resultArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
