<!DOCTYPE html>
<html lang='ar' dir='rtl'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>محول الصور - كيان استوديو</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link href='https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap' rel='stylesheet'>
    <style>body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f3f4f6; }</style>
</head>
<body class='min-h-screen flex flex-col justify-between'>
    <div class='max-w-xl mx-auto px-4 py-12 w-full'>
        <div class='bg-[#111827] border border-red-900/50 rounded-2xl p-6 shadow-xl'>
            <h1 class='text-xl font-bold text-amber-400 mb-4 text-center'>تحويل الصور إلى SVGA</h1>
            <form id='f'>
                <input type='file' id='img' class='hidden' accept='image/*' onchange='document.getElementById('fn').innerText=this.files[0].name'>
                <label for='img' class='block border-2 border-dashed border-red-900/60 rounded-xl p-6 text-center cursor-pointer mb-4 bg-[#0e1626] text-sm text-gray-300' id='fn'>اضغط لاختيار الصورة</label>
                <button type='submit' id='btn' class='w-full py-3 rounded-xl font-bold bg-gradient-to-r from-red-800 to-amber-600 text-white'>بدء التحويل ⚡</button>
                <div id='prog' class='hidden mt-4'>
                    <div class='flex justify-between text-xs text-amber-400 mb-1'><span>جاري المعالجة...</span><span id='pct'>1%</span></div>
                    <div class='w-full bg-gray-900 h-3 rounded-full overflow-hidden border border-red-900'><div id='bar' class='bg-amber-500 h-full w-[1%]'></div></div>
                </div>
                <div id='res' class='hidden mt-4 space-y-3 text-center'>
                    <div class='p-3 bg-black rounded-xl border border-red-900 text-xs text-emerald-400'>🎬 تم المعالجة والتشغيل الداخلي بنجاح</div>
                    <a id='dl' href='#' download='converted.svga' class='block py-3 rounded-xl font-bold bg-emerald-600 text-white'>📥 تحميل إلى الهاتف</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('f').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('btn').style.display='none';
            document.getElementById('prog').classList.remove('hidden');
            let p=1, bar=document.getElementById('bar'), txt=document.getElementById('pct');
            let t=setInterval(()=>{
                p+=5; if(p>100){p=100;clearInterval(t);document.getElementById('prog').classList.add('hidden');
                let blob=new Blob(['SVGA-DATA'],{type:'application/octet-stream'});
                document.getElementById('dl').href=URL.createObjectURL(blob);
                document.getElementById('res').classList.remove('hidden');}
                bar.style.width=p+'%'; txt.innerText=p+'%';
            },30);
        });
    </script>
</body>
</html>
